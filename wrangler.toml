# Cloudflare Pages 配置
# 方式一（推荐）：本地构建后直接上传 dist/
#   python scripts/build_static.py
#   npx wrangler pages deploy dist
#
# 方式二：连接 Git 仓库，让 Pages 自动构建（构建命令见下）
name = "blog"
pages_build_output_dir = "build"

[build]
command = "pip install -r requirements.txt && python scripts/gen_code_css.py && python scripts/build_static.py"

[build.environment]
PYTHON_VERSION = "3.11"
